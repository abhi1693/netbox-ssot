[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "netbox-ssot"
version = "0.0.1"
description = "Provider-driven discovery and reviewed reconciliation for NetBox"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=50.0.0,<51",
  "diffsync>=2.2.3,<3",
  "netbox-ssot-contracts==0.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/netbox_ssot"]
