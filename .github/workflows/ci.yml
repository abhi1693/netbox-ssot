name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
    uses: abhi1693/actions/.github/workflows/python-uv-tests.yml@3f57777054410f3f0e59b58ba7e16dc51288c5fd
    with:
      python-version: ${{ matrix.python-version }}
      sync-command: uv sync --all-packages --locked
      lint-command: uv run ruff check . && uv run mypy
      test-command: uv run pytest tests --cov

  netbox-plugin:
    runs-on: ubuntu-latest
    env:
      NETBOX_CONFIGURATION: netbox_ssot_test_configuration
      PYTHONPATH: ${{ github.workspace }}/tests
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: netbox
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
        options: >-
          --health-cmd "pg_isready -U netbox -d netbox"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: netbox-community/netbox
          ref: v4.6.9
          path: .netbox
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .netbox/requirements.txt
      - name: Install NetBox and plugin dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .netbox/requirements.txt
          python -m pip install pytest
          python -m pip install -e packages/contracts -e providers/netbox -e providers/unifi -e packages/plugin
      - name: Check plugin migrations
        run: python .netbox/netbox/manage.py makemigrations netbox_ssot --check --dry-run
      - name: Run plugin tests
        run: python .netbox/netbox/manage.py test netbox_ssot.tests --noinput --verbosity 2

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache-dependency-path: go.mod
      - run: test -z "$(gofmt -l agent internal providers/netbox providers/unifi)"
      - run: go test ./...
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build -trimpath -o dist/netbox-ssot-agent ./agent/cmd/netbox-ssot-agent
